# =============================================================================
# docker-compose.yml — PRODUÇÃO (VPS Ubuntu 24 + Traefik global já existente)
# Rodar da raiz do repo:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# - Traefik: rede externa 'traefik', wildcard *.srv1450678.hstgr.cloud, HTTPS
#   automático. Somente api e web entram na rede 'traefik'.
# - postgres / redis / ai: SOMENTE rede 'internal' — sem portas no host.
# =============================================================================
name: sistema-mensagem

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sm}
      POSTGRES_DB: ${POSTGRES_DB:-sm}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # Named volumes começam com dono root:root — o container da api roda como
  # usuário não-root 'node' (uid 1000) e falha com EACCES ao criar subpastas
  # em /data/media (re-host de mídia inbound e uploads outbound, CONTRACTS
  # §6/§13). Corrige a permissão uma vez, antes da api subir; idempotente.
  media-init:
    image: node:24-slim
    command: ['sh', '-c', 'chown -R 1000:1000 /data/media']
    volumes:
      - media_data:/data/media

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    # Mídia inbound re-hospedada (CONTRACTS §6) — sobrepõe o MEDIA_DIR do .env.
    environment:
      MEDIA_DIR: /data/media
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    networks:
      - internal
      - traefik
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.smapi.rule=Host(`chat.srv1450678.hstgr.cloud`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))'
      - 'traefik.http.routers.smapi.priority=20'
      # entrypoint conforme o Traefik global da VPS. Verifique o nome real com
      # `docker inspect traefik | grep -i entrypoint` — se lá for 'https'/'web-secure',
      # ajuste as duas linhas de entrypoints (smapi e smweb); router com entrypoint
      # inexistente não casa e o sintoma é 404 silencioso.
      - 'traefik.http.routers.smapi.entrypoints=websecure'
      # certresolver conforme o Traefik global da VPS. Se o resolver de lá tiver
      # outro nome (ex.: 'mytlschallenge' ou 'le'), troque a linha ativa abaixo.
      - 'traefik.http.routers.smapi.tls.certresolver=letsencrypt'
      # - 'traefik.http.routers.smapi.tls.certresolver=mytlschallenge'
      - 'traefik.http.services.smapi.loadbalancer.server.port=4000'

  # Perfil exclusivamente local/CI para o piloto fechado. Não é iniciado por
  # `up -d`, não recebe variáveis de produção e não tem acesso a nenhuma rede.
  # Ele usa o estágio `build`, que contém as dependências de teste da API.
  api-pilot:
    profiles: ['pilot']
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: build
    network_mode: none
    entrypoint: ['sh', '-lc']
    command: ['exit 0']

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_SOCKET_PATH: ${NEXT_PUBLIC_SOCKET_PATH:-/socket.io}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - traefik
    # node:24-slim não tem wget/curl — healthcheck via fetch nativo do Node.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.smweb.rule=Host(`chat.srv1450678.hstgr.cloud`)'
      - 'traefik.http.routers.smweb.priority=10'
      # mesmo entrypoint do router smapi — ajuste junto se necessário.
      - 'traefik.http.routers.smweb.entrypoints=websecure'
      # mesmo certresolver do router smapi — ajuste junto se necessário.
      - 'traefik.http.routers.smweb.tls.certresolver=letsencrypt'
      # - 'traefik.http.routers.smweb.tls.certresolver=mytlschallenge'
      - 'traefik.http.services.smweb.loadbalancer.server.port=3000'

  ai:
    build:
      context: ..
      dockerfile: infra/docker/ai.Dockerfile
    restart: unless-stopped
    # Whitelist mínima (least privilege) — NUNCA passar o .env inteiro aqui:
    # o serviço de IA processa conteúdo hostil (PDFs/URLs de clientes) e não
    # deve ter acesso a JWT_SECRET/APP_ENCRYPTION_KEY/META_APP_SECRET.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      # A rota do piloto é uma decisão operacional, não um default implícito
      # do container. Sem este repasse, a IA volta silenciosamente a liberar
      # apenas technical_support após qualquer recriação do serviço.
      PILOT_ROUTE_KEYS: ${PILOT_ROUTE_KEYS:-technical_support,billing,sales}
      IXC_INMAP_AUTO_VIABILITY_PUBLIC_URL: ${IXC_INMAP_AUTO_VIABILITY_PUBLIC_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-}
      AI_AUXILIARY_PROVIDER: ${AI_AUXILIARY_PROVIDER:-}
      AI_REVIEW_PROVIDER: ${AI_REVIEW_PROVIDER:-}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-haiku-4-5}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-512}
      ANTHROPIC_MAX_OUTPUT_TOKENS: ${ANTHROPIC_MAX_OUTPUT_TOKENS:-1024}
      ANTHROPIC_PROMPT_CACHE_ENABLED: ${ANTHROPIC_PROMPT_CACHE_ENABLED:-false}
      ANTHROPIC_PROMPT_CACHE_TTL: ${ANTHROPIC_PROMPT_CACHE_TTL:-5m}
      AI_MONTHLY_ATTENTION_BUDGET_BRL: ${AI_MONTHLY_ATTENTION_BUDGET_BRL:-2500}
      AI_BUDGET_RECIPIENT_EMAIL: ${AI_BUDGET_RECIPIENT_EMAIL:-}
      AI_USD_TO_BRL: ${AI_USD_TO_BRL:-6.0}
      OPENAI_LUNA_INPUT_USD_PER_MILLION: ${OPENAI_LUNA_INPUT_USD_PER_MILLION:-0.20}
      OPENAI_LUNA_CACHED_INPUT_USD_PER_MILLION: ${OPENAI_LUNA_CACHED_INPUT_USD_PER_MILLION:-0.02}
      OPENAI_LUNA_CACHE_WRITE_USD_PER_MILLION: ${OPENAI_LUNA_CACHE_WRITE_USD_PER_MILLION:-0.25}
      OPENAI_LUNA_OUTPUT_USD_PER_MILLION: ${OPENAI_LUNA_OUTPUT_USD_PER_MILLION:-1.20}
      ANTHROPIC_SONNET_INPUT_USD_PER_MILLION: ${ANTHROPIC_SONNET_INPUT_USD_PER_MILLION:-2.0}
      ANTHROPIC_SONNET_CACHED_INPUT_USD_PER_MILLION: ${ANTHROPIC_SONNET_CACHED_INPUT_USD_PER_MILLION:-0.20}
      ANTHROPIC_SONNET_CACHE_WRITE_USD_PER_MILLION: ${ANTHROPIC_SONNET_CACHE_WRITE_USD_PER_MILLION:-2.50}
      ANTHROPIC_SONNET_OUTPUT_USD_PER_MILLION: ${ANTHROPIC_SONNET_OUTPUT_USD_PER_MILLION:-10.0}
      OPENAI_EMBEDDING_USD_PER_MILLION: ${OPENAI_EMBEDDING_USD_PER_MILLION:-0.02}
      # Sentry (CONTRACTS §14, opcional) — mesma DSN da api; vazio = SDK nem é importado.
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  internal:
    driver: bridge
  traefik:
    external: true

volumes:
  pg_data:
  redis_data:
  media_data:
